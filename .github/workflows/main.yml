name: Build Android

on:
  push:
    branches: [ mod, main ]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ mod, main ]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag for the GitHub Release (leave empty to skip the release)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildAndroid:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_PLATFORM: android-36
      ANDROID_BUILD_TOOLS: 36.0.0
      ANDROID_NDK_VERSION: 29.0.14206865
      HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
      HXCPP_CACHE_MB: 4000
      GRADLE_OPTS: -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Platform + build-tools + NDK en un solo cache
      - name: Cache Android SDK parts
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/platforms/${{ env.ANDROID_PLATFORM }}
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_PLATFORM }}-${{ env.ANDROID_BUILD_TOOLS }}-${{ env.ANDROID_NDK_VERSION }}

      - name: Install Android platform, build-tools and NDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager --install "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Cache haxelib
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('setup/**', 'Project.xml') }}

      - name: Install Haxe dependencies
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Point haxelib to cache
        if: steps.haxelib-cache.outputs.cache-hit == 'true'
        run: haxelib setup ~/haxelib

      - name: Configure Android SDK/NDK paths
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Setup lime for Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      # Solo restaura; el guardado se hace aparte, después de compilar
      - name: Restore hxcpp objects
        uses: actions/cache/restore@v4
        with:
          path: .hxcpp_cache
          key: hxcpp-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            hxcpp-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Project.xml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate placeholder keystore if missing
        run: |
          if [ ! -f key.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore key.keystore \
              -storetype JKS \
              -storepass KEYSTORE_PASSWORD \
              -alias KEYSTORE_ALIAS \
              -keypass KEYSTORE_ALIAS_PASSWORD \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=PsychEngineMint, OU=None, O=None, L=None, S=None, C=US"
          fi

      - name: Compile
        run: haxelib run lime build Project.xml android -D officialBuild

      # always(): si el build falla a mitad, igual se guardan los objetos ya compilados.
      # No guarda en PRs para no llenar el límite de 10 GB de cache del repo.
      - name: Save hxcpp objects
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v4
        with:
          path: .hxcpp_cache
          key: hxcpp-${{ runner.os }}-${{ github.sha }}

      - name: Locate APK
        id: apk
        run: |
          APK=$(find export -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found under export/"
            find export -maxdepth 4 -type d || true
            exit 1
          fi
          echo "Found APK: $APK"
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          path: ${{ steps.apk.outputs.path }}
          compression-level: 0
          if-no-files-found: error

      - name: Create Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: ${{ steps.apk.outputs.path }}
